# Reusable: build a Docker image and push it to ECR.
# Mirrors the Dataviz repo's build-push-ecr.yml so the deploy patterns stay aligned.
name: Build and Push to ECR

on:
  workflow_call:
    inputs:
      aws-region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string
      ecr-repository:
        description: "ECR repository name"
        required: true
        type: string
      environment:
        description: "Target GitHub environment (production)"
        required: true
        type: string
      image-tag:
        description: "Docker image tag (SHA)"
        required: true
        type: string
      build-context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
    secrets:
      ECR_ROLE_ARN:
        required: true
    outputs:
      image_uri:
        description: "Full ECR image URI (SHA-tagged)"
        value: ${{ jobs.build-and-push.outputs.image_uri }}

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.define-image.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}-build
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2

      - name: Define image URI
        id: define-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ inputs.ecr-repository }}
          TAG: ${{ inputs.image-tag }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "::error::ECR Registry is empty — login failed"
            exit 1
          fi
          echo "image_uri=$REGISTRY/$REPO:$TAG" >> $GITHUB_OUTPUT
          echo "Target image: $REGISTRY/$REPO:$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.define-image.outputs.image_uri }}
          cache-from: type=gha,scope=${{ inputs.ecr-repository }}
          cache-to: type=gha,scope=${{ inputs.ecr-repository }},mode=max
